[project]
name = "pipen-deprecated"
version = "1.0.2"
description = "Marking pipen processes as deprecated"
authors = [
    {name = "pwwang", email = "pwwang@pwwang.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pipen>=1.1",
]

[project.entry-points.pipen]
deprecated = "pipen_deprecated:pipen_deprecated_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-vv --cov-config=.coveragerc --cov=pipen_deprecated --cov-report xml:.coverage.xml --cov-report term-missing"
console_output_style = "progress"
junit_family = "xunit1"

[tool.uv]
prerelease = "allow"
